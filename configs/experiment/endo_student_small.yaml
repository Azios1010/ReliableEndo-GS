  pixel_center: integer
  disparity: u_left_minus_right_current_grid_pixels
  depth_units: m
  report_depth_units: mm
  rgb_metric_range: [0.0, 1.0]
  deployment_inputs: [left_rgb, right_rgb, calibration, sensor_support]
  ground_truth_at_inference: forbidden

arms:
  student:
    model: StudentReconstructionModel
    training_config: configs/training/student_kd_multiscale_pilot.yaml
    reconstruction_config: configs/reconstruction/a04_reference.yaml
    reconstruction_config_sha256: 91a6f8206a4be7a0e51a35d80958345dbcfdb93ca3894e419077f29da24835ba
    initialization: fresh_seeded_no_checkpoint
    resume: false
    trainable: [stereo_student, gaussian_head]
    student_precision: fp32
    optimizer: {name: Adam, learning_rate: 0.001, weight_decay: 0.0}
    learning_rate_schedule: constant
    updates: 112
    evaluate_after_updates: [0, 28, 56, 112]
    loss:
      teacher_disparity_smooth_l1: 1.0
      mean_left_right_rgb_charbonnier: 1.0
      charbonnier_epsilon: 0.001
      kd_scale_px: 1.0
      ground_truth_disparity: 0.0
    teacher:
      name: FoundationStereo
      frozen: true
      valid_iters: 32
      precision: fp16
      runtime_config_env: RELIABLE_ENDO_TEACHER_RUNTIME_CONFIG
      identity_hash: 40b1862f12991454f97e03a9cc2e9d802d0a1af082bcaf4afe4aa5d10b09eb3c
      cache_root_env: RELIABLE_ENDO_SMALL_TEACHER_CACHE
      cache_mode: read_only
      populate_cache: false
      missing_or_mismatched_target: error
      validation_target_use: detached_diagnostic_only_never_optimizer

  endo_e2e_gs:
    variant: a00_metric_geometry
    model: StereoEndoModel
    upstream_root: third_party/endo_e2e_gs
    upstream_commit: 186fa2b4a2159b28393492f6df1aa444b54391a8
    require_clean_upstream: true
    initialization: fresh_seeded_no_public_or_local_pretrained_checkpoint
    resume: false
    upstream_architecture_and_loss: unchanged
    train_iters: 3
    val_iters: 3
    freeze_raft_batchnorm_as_upstream: true
    optimizer:
      name: AdamW
      learning_rate: 0.0002
      weight_decay: 0.00001
      eps: 0.00000001
      gradient_clip_norm: 1.0
    # This is a short learning diagnostic, not the paper's training schedule.
    # Preserve released LR horizons; stop early without compressing warmup.
    stage1:
      upstream_config: third_party/endo_e2e_gs/config/stage1.yaml
      upstream_config_sha256: 1a06e1b8ca189555d72956ef3e999002ca1d20ac178724c38eb31433bd90f1ae
      updates: 56
      precision: fp32
      loss: upstream_sequence_loss_on_fit_gt_disparity
      loss_weight: 1.0
      scheduler:
        name: OneCycleLR
        total_steps: 100100
        pct_start: 0.01
        anneal_strategy: linear
        cycle_momentum: false
    stage2:
      # Baseline Stage 2 is its original joint training, not research Phase II.
      upstream_config: third_party/endo_e2e_gs/config/stage2.yaml
      upstream_config_sha256: 6d4e9ff12d6c48369009ca9ceaa22fc533ffdce866faf706381b571b97c0d1e2
      updates: 56
      initialization: stereo_from_this_run_stage1_fresh_gaussian_regressor
      optimizer_and_scheduler: fresh_as_upstream_stage_transition
      precision: upstream_amp
      max_amp_overflow_retries: 32
      render_supervision_views: [left]
      loss: {upstream_sequence_disparity: 1.0, left_rgb_l1: 0.8, left_rgb_one_minus_ssim: 0.2}
      scheduler:
        name: OneCycleLR
        total_steps: 10100
        pct_start: 0.01
        anneal_strategy: linear
        cycle_momentum: false
    # Explicit separate variant: learned modules/loss unchanged, geometry adapted.
    protocol_bridge:
      status: explicit_a00_metric_variant_requires_adapter_tests
      rgb_input_conversion: explicit_0_1_to_minus1_1
      metric_depth_and_camera_alignment: canonical_reconstruct_rectified
      upstream_per_image_depth_minmax: replaced_by_metric_depth_in_this_variant_only
      upstream_half_pixel_backprojection: replaced_by_canonical_integer_center_backprojection
      upstream_inference_mask: sensor_support_only_never_gt_disparity_validity
      right_target_camera_render: same_ProductionFieldRenderer_as_student
      upstream_source_modified: false
      native_parity_or_paper_reproduction_claim: false

