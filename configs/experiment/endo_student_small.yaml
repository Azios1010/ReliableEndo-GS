    samples: 14
    data_role: final_train
    purpose: development_evaluation_only
    checkpoint_selection: fixed_final_update_no_validation_selection
  require_disjoint_sample_ids: true
  require_disjoint_keyframes: true
  resolution_hw: [512, 640]
  paired_crop: null
  augmentation: none
  rgb_resize: bilinear_align_corners_false
  supervision_resize: nearest_exact_then_scale_horizontal_disparity_once
