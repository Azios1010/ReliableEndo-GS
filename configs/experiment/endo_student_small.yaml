  final_train_datasets: [1, 2, 3, 4, 5, 6, 7]
  final_test_datasets_reserved: [8, 9]
  # Bind to the existing immutable pilot manifests; do not choose new frames.
  manifest_root_env: RELIABLE_ENDO_SMALL_MANIFEST_ROOT
  manifest_source_experiment: student-capacity-20261020T093057Z
  fit:
