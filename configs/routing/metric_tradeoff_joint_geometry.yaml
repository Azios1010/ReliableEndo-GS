# Proposed bounded joint policy; these are engineering tolerances, not
# measured noise floors, clinical limits, or a development-fitted optimum.
schema: metric_action_tradeoff.v2
maximum_depth_mae_increase_mm: 0.05
maximum_local_depth_mae_increase_mm: 0.25
maximum_depth_rmse_increase_mm: 0.05
maximum_local_depth_rmse_increase_mm: 0.25
maximum_depth_p95_increase_mm: 0.1
maximum_psnr_drop_db: 0.05
maximum_ssim_drop: 0.002
maximum_outside_rgb_increase: 0.0001
maximum_local_rgb_increase: 0.001
maximum_coverage_drop: 0.0
# Geometry/render weight 1.5:1; global/local and left/right share equally.
geometry_weight: 1.0
local_geometry_weight: 1.0
geometry_priority: 1.5
psnr_weight: 0.5
ssim_weight: 0.5
collateral_weight: 0.0
local_render_weight: 0.0
maximum_predicted_violation_probability: 0.2
