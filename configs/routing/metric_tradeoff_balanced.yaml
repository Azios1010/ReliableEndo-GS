# Opt-in bounded remediation pilot; historical strict reference stays intact.
# These are proposed tolerances, not proven noise levels or clinical limits.
schema: metric_action_tradeoff.v2
maximum_depth_mae_increase_mm: 0.0
maximum_local_depth_mae_increase_mm: 0.0
maximum_depth_rmse_increase_mm: 0.0
maximum_local_depth_rmse_increase_mm: 0.0
maximum_depth_p95_increase_mm: 0.0
maximum_psnr_drop_db: 0.01
maximum_ssim_drop: 0.0005
maximum_outside_rgb_increase: 1.0e-5
maximum_local_rgb_increase: 1.0e-4
maximum_coverage_drop: 0.0
# Separate groups each sum to one: geometry (global/local), render (two views).
geometry_weight: 1.0
local_geometry_weight: 0.25
psnr_weight: 0.5
ssim_weight: 0.5
# Spatial RGB remains constrained; no extra reward duplicating render quality.
collateral_weight: 0.0
local_render_weight: 0.0
utility_gain_cap: 1.0
maximum_predicted_violation_probability: 0.1
component_risk_weight: 0.25
constraint_margin_weight: 0.25
calibration_min_class_groups: 2
minimum_utility: 0.0
comparison_epsilon: 1.0e-6
ranking_epsilon: 1.0e-6
ranking_weight: 0.25
width: 32
epochs: 100
learning_rate: 0.001
seed: 0
bootstrap_repetitions: 200
