# Bounded counterpart to student_kd_multiscale.yaml; no full-data continuation.
# 7 fixed FIT images x 16 passes = 112 model updates, matching the previous pilot.
schema: student_joint_learning.v1
stereo_architecture: multiscale
width: 64
bins: 64
minimum_effective_px: 0.25
student_epochs: 16
joint_epochs: 0
learning_rate: 0.001
model_lr_schedule: constant
reconstruction_weight: 1.0
kd_weight: 1.0
repair_weight: 1.0
checkpoint_every: 28
seed: 20261006
