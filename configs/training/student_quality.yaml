# Student-only quality qualification; optional full-data run keeps the same LR horizon.
schema: student_joint_learning.v1
width: 32
bins: 32
minimum_effective_px: 0.25
student_epochs: 10
joint_epochs: 0
learning_rate: 0.001
model_lr_schedule: cosine_epochs
model_lr_decay_epochs: 10
model_lr_min_ratio: 0.1
reconstruction_weight: 1.0
kd_weight: 0.0
repair_weight: 1.0
checkpoint_every: 100
seed: 20261006
