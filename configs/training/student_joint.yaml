# Student/head warmup, then joint model/repair updates with fresh utility labels.
# FP32 runtime is explicit in student_runtime; native execution remains opt-in.
schema: student_joint_learning.v1
width: 32
bins: 32
minimum_effective_px: 0.25
student_epochs: 1
joint_epochs: 1
learning_rate: 0.001
reconstruction_weight: 1.0
kd_weight: 1.0
repair_weight: 1.0
checkpoint_every: 100
seed: 0
