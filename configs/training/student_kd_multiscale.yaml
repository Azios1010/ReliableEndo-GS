# Opt-in stronger KD candidate; compact student_kd.yaml remains the control.
# Quality must be measured before any full run or student/head freeze.
schema: student_joint_learning.v1
stereo_architecture: multiscale
width: 64
bins: 64
minimum_effective_px: 0.25
student_epochs: 10
joint_epochs: 0
learning_rate: 0.001
model_lr_schedule: cosine_epochs
model_lr_decay_epochs: 10
model_lr_min_ratio: 0.1
reconstruction_weight: 1.0
kd_weight: 1.0
repair_weight: 1.0
checkpoint_every: 100
seed: 20261006
