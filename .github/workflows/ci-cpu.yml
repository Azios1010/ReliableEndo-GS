name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # CPU tests import the pinned upstream tree, which must remain unmodified.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" --constraint environments/ci-constraints.txt

      - name: Record and verify CPU environment
        run: |
          python -m pip check
          python -m pip freeze
          python -c 'import torch; print(torch.__version__); assert torch.version.cuda is None, "CPU CI requires the CPU PyTorch wheel"'

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q

      - name: Run infrastructure smoke command
        run: reg smoke --config configs/experiment/infrastructure_smoke.yaml

      - name: Compile package
        run: python -m compileall src

      - name: Verify tracked files are unchanged
        run: |
          git status --short
          git diff --exit-code
