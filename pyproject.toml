[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-endo-gs"
version = "0.1.0"
description = "Research infrastructure for ReliableEndo-GS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "tifffile>=2023.7",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "matplotlib>=3.7",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "scipy>=1.10",
    "types-PyYAML>=6.0",
    "yacs>=0.1.8",
]

[project.scripts]
reg = "reliable_endo_gs.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["reliable_endo_gs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tifffile"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "reliable_endo_gs.baseline.*",
    "reliable_endo_gs.data.scared_c",
    "reliable_endo_gs.data.scared_c_stage1_cache",
    "reliable_endo_gs.data.scared_c_stage1_quality",
    "reliable_endo_gs.data.scared_c_stage1_split",
    "reliable_endo_gs.data.scared_c_stage2",
    "reliable_endo_gs.data.scared_c_stereo",
    "reliable_endo_gs.data.scared_multi",
    "reliable_endo_gs.data.adapters.scared_c",
    "reliable_endo_gs.evaluation.p1",
    "reliable_endo_gs.probabilistic_gs.*",
    "reliable_endo_gs.reliability.*",
    "reliable_endo_gs.uncertainty.*",
    "reliable_endo_gs.training.phase1",
    "reliable_endo_gs.training.uncertainty",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "upstream_gpu: optional checks requiring the pinned upstream CUDA/rasterizer environment",
]
